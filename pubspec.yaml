name: baytak_admin
description: "Baytak Admin Dashboard - Standalone Flutter Web Control Panel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2

  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.3
  intl: any
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
